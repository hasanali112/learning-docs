# main branch এ push করলে সাইট build করে GitHub Pages এ তোলে
name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/configure-pages@v5

      - name: Install
        run: npm ci

      - name: Build
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          # username.github.io repo হলে সাইট থাকে "/" এ, অন্যথায় "/<repo>/" এ
          if [[ "$REPO" == *.github.io ]]; then
            export DOCS_BASE="/"
          else
            export DOCS_BASE="/$REPO/"
          fi
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
